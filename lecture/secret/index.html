<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Access - Programming 1</title>
    <style>
        :root {
            --bg: #030a16;
            --accent: #3b82f6;
            --text: #f8fafc;
            --error: #ef4444;
        }
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .gate-shell {
            max-width: 400px;
            padding: 40px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
        }
        input:focus { border-color: var(--accent); }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        #message { margin-top: 16px; color: var(--error); font-size: 0.85rem; height: 1em; }
    </style>
</head>
<body>
    <div class="gate-shell">
        <div class="icon">🔒</div>
        <h1>Access Restricted</h1>
        <p>このセクションは解説・解答を含むため、アクセス制限されています。講義で案内されたパスワードを入力してください。</p>
        
        <input type="password" id="pw" placeholder="Enter Password" autofocus>
        <button onclick="check()">Unlock Content</button>
        <div id="message"></div>
    </div>

    <script>
        const hash = "pg1-2026"; // 仮のパスワード
        function check() {
            const input = document.getElementById('pw').value;
            const msg = document.getElementById('message');
            if (input === hash) {
                // 正解なら content.html へ
                window.location.href = "content.html";
            } else {
                msg.textContent = "パスワードが正しくありません。";
                document.getElementById('pw').value = "";
            }
        }
        document.getElementById('pw').onkeypress = (e) => {
            if(e.key === 'Enter') check();
        };
    </script>
</body>
</html>
